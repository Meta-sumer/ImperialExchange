# /etc/nginx/conf.d/gzip.conf
#
# Compression for everything nginx proxies. Install with:
#   sudo cp nginx/gzip.conf /etc/nginx/conf.d/gzip.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# NOTE — there is deliberately no `gzip on;` line here.
# conf.d/*.conf is included INTO the http block, and Debian/Ubuntu's stock
# /etc/nginx/nginx.conf already sets `gzip on;` there. Repeating it in the same
# context is a hard error:
#   nginx: [emerg] "gzip" directive is duplicate in /etc/nginx/conf.d/gzip.conf:1
# The stock file leaves every OTHER gzip directive commented out, which is why
# they belong here. If you ever deploy to a box whose nginx.conf does NOT enable
# gzip, add `gzip on;` to that file rather than to this one.
#
# gzip_proxied is the directive that actually matters for this platform: it
# defaults to `off`, and every location in the vhost is a proxy_pass, so without
# it nginx compresses nothing at all — even with gzip enabled globally. That is
# what left the SPA bundle going out raw (index.js 384 kB instead of 122 kB,
# index.css 116 kB instead of 18 kB, Trade.js 517 kB instead of 144 kB).
#
# The backend gzips its own JSON via the compression middleware; nginx passes an
# already-encoded upstream response straight through rather than re-compressing,
# so the two layers do not fight.

gzip_vary on;            # Vary: Accept-Encoding, so caches keep both copies
gzip_proxied any;        # compress proxied responses — the whole point
gzip_comp_level 5;       # the knee: near level-9 ratio at a fraction of the CPU
gzip_min_length 1024;    # under 1 KB the framing overhead is not worth it

# text/html is always compressed when gzip is on and must NOT be listed here —
# listing it is a warning and a no-op.
gzip_types
  application/javascript
  application/json
  application/manifest+json
  application/wasm
  application/xml
  font/ttf
  font/woff
  image/svg+xml
  text/css
  text/javascript
  text/plain
  text/xml;
