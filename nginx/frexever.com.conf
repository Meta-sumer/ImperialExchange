# /etc/nginx/sites-available/frexever.com
#
# Single-domain reverse proxy for the Frexever trading platform.
# Path-based routing to the internal containers:
#   /api/*   → backend  (127.0.0.1:5000)
#   /ws      → backend websocket
#   /admin/* → admin SPA (127.0.0.1:8082) — Vite built with base=/admin/
#   /*       → client SPA (127.0.0.1:8081)
#
# Certbot injects the SSL block when you run:
#   sudo certbot --nginx -d frexever.com -d www.frexever.com
# Before certbot, this is HTTP-only on :80; after, port 80 redirects to 443.

# www → apex redirect. Keeps everyone on https://frexever.com so the SPA's
# baked API origin (https://frexever.com/api) is always same-origin (no CORS).
server {
  listen 80;
  listen [::]:80;
  server_name www.frexever.com;
  return 301 https://frexever.com$request_uri;
}

server {
  listen 80;
  listen [::]:80;
  server_name frexever.com;

  # File upload size — matches Express's 15 MB cap (KYC docs).
  client_max_body_size 16M;

  # ── Compression ──────────────────────────────────────────────────────
  # gzip_proxied is the directive that actually matters here. It defaults to
  # `off`, and EVERY location in this file is a proxy_pass, so without it nginx
  # refuses to compress a single byte — even with `gzip on` in the global http
  # block. That is why the SPA bundle was going out raw: index.js 384 kB instead
  # of 122 kB, index.css 116 kB instead of 18 kB, Trade.js 517 kB instead of
  # 144 kB — about 1 MB of a first paint that should be ~284 kB.
  #
  # The backend now gzips its own JSON (compression middleware), and nginx
  # passes an already-encoded upstream response straight through rather than
  # re-compressing it, so these two layers do not fight.
  gzip on;
  gzip_vary on;            # Vary: Accept-Encoding, so caches keep both copies
  gzip_proxied any;        # compress proxied responses — the whole point
  gzip_comp_level 5;       # 5 is the knee: ~level-9 ratio at a fraction of CPU
  gzip_min_length 1024;    # below 1 KB the framing overhead is not worth it
  gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/wasm
    application/xml
    font/ttf
    font/woff
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;
  # text/html is always compressed when gzip is on and must NOT be listed here.


  # WebSocket — needs Upgrade + long read timeout for long-lived
  # ticker / candle / orderbook streams.
  location /ws {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  # Razorpay webhook is HMAC-signed by Razorpay; nginx just proxies.
  location /api/webhooks/razorpay {
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Everything under /api.
  location /api/ {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Admin SPA — Vite bundle built with base=/admin/ so assets resolve
  # under this prefix. The /admin (no slash) → /admin/ redirect ensures
  # the SPA's relative asset URLs work on first hit.
  location = /admin { return 301 /admin/; }
  location /admin/ {
    proxy_pass http://127.0.0.1:8082/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Client SPA — everything else.
  location / {
    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
